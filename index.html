<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Тичер Боксы — RNG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06060e;
  --border:rgba(255,255,255,0.08);
  --text:#eeeef8;
  --muted:#9494b8;
  --primary:#8b5cf6;
  --accent:#ec4899;
  --warm:#f97316;
  --green:#10b981;

  --c-common:#9ca3af;
  --c-rare:#3b82f6;
  --c-epic:#a855f7;
  --c-mythic:#ef4444;
  --c-legendary:#fbbf24;
  --c-exotic:#fb923c;
  --c-secret:#22d3ee;
  --c-glitch:#f0abfc;

  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease-reel:cubic-bezier(.07,.66,.13,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
body::before{
  content:'';position:fixed;inset:-20%;z-index:-2;
  background:
    radial-gradient(circle at 20% 20%,rgba(139,92,246,.18),transparent 40%),
    radial-gradient(circle at 80% 30%,rgba(236,72,153,.13),transparent 45%),
    radial-gradient(circle at 50% 90%,rgba(249,115,22,.10),transparent 50%);
  filter:blur(40px);animation:bgShift 18s ease-in-out infinite alternate;
}
@keyframes bgShift{to{transform:translate(4%,-3%) scale(1.05)}}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(6,6,14,.6) 100%);
}

.shake-screen{animation:shakeScr .5s var(--ease-out-expo)}
@keyframes shakeScr{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}
  60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}
}

.app{max-width:480px;margin:0 auto;padding:18px 14px 60px;display:flex;flex-direction:column;gap:14px}

.hud{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:'Unbounded',sans-serif;font-weight:900;font-size:18px;letter-spacing:-.5px}
.brand span{background:linear-gradient(90deg,var(--primary),var(--accent),var(--warm));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto;animation:shimmer 4s linear infinite}
@keyframes shimmer{to{background-position:200% center}}
.chips{display:flex;gap:6px}
.chip{font-family:'Unbounded',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;padding:7px 12px;border-radius:50px;border:1px solid var(--border);background:rgba(0,0,0,.4);backdrop-filter:blur(20px);display:inline-flex;align-items:center;gap:6px}
.chip.coins{color:#fde68a}
.chip.opens{color:#c4b5fd}

.card{
  backdrop-filter:blur(18px);

  background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));
  border:1px solid var(--border);border-radius:24px;padding:16px;position:relative;overflow:hidden;
}
.card-title{font-family:'Unbounded',sans-serif;font-weight:700;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

/* OPENER */
.opener{padding:20px 16px}
.luck-strip{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;font-family:'Unbounded',sans-serif;font-size:11px;letter-spacing:2px;font-weight:800;color:var(--muted);min-height:18px}
.luck-strip .lk-mult{color:var(--green)}
.luck-strip .lk-mult.big{color:#fde68a;text-shadow:0 0 14px rgba(253,230,138,.7)}

.reel-wrap{
  position:relative;height:140px;border-radius:20px;overflow:hidden;
  background:radial-gradient(ellipse at center,rgba(139,92,246,.08),transparent 70%),rgba(0,0,0,.4);
  border:1px solid var(--border);margin-bottom:12px;
}
.reel-wrap::before,.reel-wrap::after{
  content:'';position:absolute;top:0;bottom:0;width:60px;z-index:3;pointer-events:none;
}
.reel-wrap::before{left:0;background:linear-gradient(90deg,#06060e,transparent)}
.reel-wrap::after{right:0;background:linear-gradient(-90deg,#06060e,transparent)}
.marker{
  position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);z-index:4;
  background:linear-gradient(180deg,transparent,#fff,transparent);
  box-shadow:0 0 12px #fff,0 0 30px var(--primary);
}
.marker::before,.marker::after{
  content:'';position:absolute;left:50%;width:0;height:0;border:6px solid transparent;transform:translateX(-50%);
}
.marker::before{top:-1px;border-top-color:#fff}
.marker::after{bottom:-1px;border-bottom-color:#fff}

.reel{
  position:absolute;top:50%;left:0;display:flex;gap:10px;padding:0 50%;
  transform:translateY(-50%);will-change:transform;
}
.reel-item{
  flex:0 0 110px;height:110px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border:2px solid var(--rc,var(--border));
  background:linear-gradient(180deg,color-mix(in oklab,var(--rc,#888) 18%,transparent),rgba(0,0,0,.5));
  box-shadow:0 0 22px color-mix(in oklab,var(--rc,#888) 25%,transparent),inset 0 0 16px color-mix(in oklab,var(--rc,#888) 20%,transparent);
  position:relative;overflow:hidden;
}
.reel-item .em{font-size:36px;line-height:1;position:relative;z-index:2}
.reel-item .em.img,.result .em.img,.inv-cell .e.img{
  display:block;
  object-fit:cover;
  object-position:center top;
  background:linear-gradient(135deg,#1a1530,#0a0818);
  box-shadow:0 6px 18px rgba(0,0,0,.45);
}
.reel-item .em.img{
  width:52px;
  aspect-ratio:3/4;
  border-radius:10px;
}
.result .em.img{
  width:110px;
  aspect-ratio:3/4;
  height:auto;
  border-radius:16px;
}
.inv-cell .e.img{
  width:38px;
  aspect-ratio:3/4;
  height:auto;
  border-radius:8px;
  margin:0 auto;
}
.reel-item .nm{font-size:10px;font-weight:800;text-align:center;padding:0 4px;line-height:1.1;color:var(--rc,#fff);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:2}
.reel-item .tg{position:absolute;top:4px;right:4px;font-family:'Unbounded',sans-serif;font-size:8px;font-weight:800;letter-spacing:1px;padding:2px 5px;border-radius:50px;z-index:3}
.tg-gold{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1000;box-shadow:0 0 10px rgba(251,191,36,.6)}
.tg-rainbow{background:linear-gradient(135deg,#ec4899,#8b5cf6,#06b6d4);color:#fff;box-shadow:0 0 10px rgba(139,92,246,.6)}

/* gold variant */
.reel-item.is-gold,.result.is-gold{
  --rc:#fbbf24;
  background:radial-gradient(ellipse at top,rgba(251,191,36,.35),transparent 60%),linear-gradient(180deg,rgba(251,191,36,.25),rgba(20,15,5,.85));
  box-shadow:0 0 30px rgba(251,191,36,.55),inset 0 0 24px rgba(251,191,36,.35);
}
.reel-item.is-gold::before,.result.is-gold::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,235,160,.55) 50%,transparent 70%);
  background-size:200% 100%;animation:goldShine 2.4s linear infinite;mix-blend-mode:screen;
}
@keyframes goldShine{from{background-position:200% 0}to{background-position:-200% 0}}

/* rainbow variant */
.reel-item.is-rainbow,.result.is-rainbow{
  --rc:#fff;
  background:linear-gradient(135deg,rgba(236,72,153,.35),rgba(139,92,246,.35),rgba(6,182,212,.35)),rgba(0,0,0,.5);
  box-shadow:0 0 30px rgba(168,85,247,.55),inset 0 0 24px rgba(168,85,247,.4);
  border-color:transparent;
  background-clip:padding-box;
}
.reel-item.is-rainbow::before,.result.is-rainbow::before{
  content:'';position:absolute;inset:-2px;border-radius:inherit;padding:2px;z-index:0;
  background:conic-gradient(from 0deg,#ec4899,#f97316,#fbbf24,#10b981,#06b6d4,#8b5cf6,#ec4899);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:rbSpin 4s linear infinite;
}
@keyframes rbSpin{to{transform:rotate(360deg)}}

/* clover & bonus reel items */
.reel-item.is-clover{--rc:var(--green);background:radial-gradient(ellipse at center,rgba(16,185,129,.35),transparent 70%),rgba(0,0,0,.5);box-shadow:0 0 24px rgba(16,185,129,.6),inset 0 0 16px rgba(16,185,129,.3)}
.reel-item.is-bonus{--rc:#fde047;background:radial-gradient(ellipse at center,rgba(253,224,71,.35),transparent 70%),rgba(0,0,0,.5);box-shadow:0 0 24px rgba(253,224,71,.55),inset 0 0 16px rgba(253,224,71,.3)}
.reel-item.is-clover .em,.reel-item.is-bonus .em{font-size:50px}
.reel-item.is-clover .nm,.reel-item.is-bonus .nm{display:none}

.reel-item.is-glitch .em{animation:glitchFx .3s steps(2) infinite}
@keyframes glitchFx{0%,100%{transform:translate(0);filter:none}25%{transform:translate(-2px,1px);filter:hue-rotate(120deg)}75%{transform:translate(2px,-1px);filter:hue-rotate(240deg)}}

.reel-wrap.spinning .marker{animation:markerPulse .35s ease-in-out infinite}
@keyframes markerPulse{50%{box-shadow:0 0 24px #fff,0 0 60px var(--primary)}}

.reel-wrap.locked{
  border-color:var(--rc,var(--primary));
  box-shadow:0 0 0 1px var(--rc,var(--primary)),0 0 60px color-mix(in oklab,var(--rc,var(--primary)) 60%,transparent);
  animation:lockedPulse 1.6s ease-in-out infinite;
}
@keyframes lockedPulse{50%{box-shadow:0 0 0 1px var(--rc),0 0 90px color-mix(in oklab,var(--rc) 80%,transparent)}}

/* result */
.result{
  position:absolute;inset:8px;display:none;align-items:center;justify-content:center;flex-direction:column;
  border-radius:14px;z-index:5;text-align:center;padding:8px;overflow:hidden;
  background:radial-gradient(ellipse at center,color-mix(in oklab,var(--rc,#888) 35%,transparent),rgba(0,0,0,.85));
}
.result.show{display:flex;animation:resultPop .65s var(--ease-spring)}
@keyframes resultPop{
  0%{transform:scale(.4) rotate(-8deg);opacity:0}
  60%{transform:scale(1.08) rotate(2deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.result .rays{
  content:'';position:absolute;inset:-100%;
  background:conic-gradient(from 0deg,transparent 0,color-mix(in oklab,var(--rc,#fff) 40%,transparent) 8%,transparent 16%,transparent 50%,color-mix(in oklab,var(--rc,#fff) 40%,transparent) 58%,transparent 66%);
  animation:rays 6s linear infinite;opacity:.55;z-index:0;mix-blend-mode:screen;
}
@keyframes rays{to{transform:rotate(360deg)}}
.result>*{position:relative;z-index:2}
.result .em{font-size:48px;line-height:1}
.result .rar{font-family:'Unbounded',sans-serif;font-size:10px;letter-spacing:3px;font-weight:800;color:var(--rc);margin-top:6px}
.result .nm{font-weight:800;font-size:14px;margin-top:2px}
.result .rw{font-weight:800;font-size:13px;margin-top:6px;color:#fde68a}
.result .vtag{position:absolute;top:8px;left:8px;font-family:'Unbounded',sans-serif;font-size:9px;letter-spacing:2px;font-weight:800;padding:4px 8px;border-radius:50px;z-index:3}
.result .badge-new{
  position:absolute;top:8px;right:8px;background:linear-gradient(135deg,var(--accent),var(--warm));
  font-family:'Unbounded',sans-serif;font-size:9px;letter-spacing:2px;font-weight:800;padding:4px 8px;border-radius:50px;color:#fff;
  box-shadow:0 4px 18px rgba(236,72,153,.5);z-index:3;
}

.particles{position:absolute;inset:0;pointer-events:none;z-index:6}

/* trail of recent rolls */
.trail{display:flex;gap:4px;justify-content:center;margin-bottom:10px;min-height:32px;flex-wrap:wrap}
.trail-pill{
  font-size:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.3);
  animation:trailIn .35s var(--ease-spring);
}
.trail-pill.t-clover{border-color:var(--green);box-shadow:0 0 10px rgba(16,185,129,.5)}
.trail-pill.t-bonus{border-color:#fde047;box-shadow:0 0 10px rgba(253,224,71,.5)}
.trail-pill.t-gold{border-color:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.5)}
.trail-pill.t-rainbow{background:linear-gradient(135deg,#ec4899,#8b5cf6,#06b6d4);border-color:transparent}
@keyframes trailIn{from{opacity:0;transform:scale(.5) translateX(-12px)}to{opacity:1;transform:none}}

.btn-play{
  position:relative;width:100%;padding:16px;border:none;border-radius:18px;
  font-family:'Unbounded',sans-serif;font-weight:900;font-size:14px;letter-spacing:2px;color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  cursor:pointer;overflow:hidden;
  box-shadow:0 10px 40px rgba(139,92,246,.45),inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .15s var(--ease-spring),filter .2s;
}
.btn-play:active{transform:scale(.97)}
.btn-play:disabled{cursor:not-allowed;filter:grayscale(.5) brightness(.7)}
.btn-play::after{
  content:'';position:absolute;top:0;bottom:0;width:50%;left:-50%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  animation:shine 3s ease-in-out infinite;
}
@keyframes shine{50%{left:100%}}
.btn-play .cd-bar{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.7);width:0%;transition:width .1s linear}

.toggles{display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap}
.toggle{font-family:'Unbounded',sans-serif;font-size:10px;letter-spacing:1.5px;padding:6px 12px;border-radius:50px;border:1px solid var(--border);background:rgba(0,0,0,.4);color:var(--muted);cursor:pointer}
.toggle.on{border-color:var(--primary);color:#fff;background:rgba(139,92,246,.15)}

/* inventory */
.inv-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (max-width:380px){.inv-grid{grid-template-columns:repeat(5,1fr)}}
.inv-cell{
  aspect-ratio:1;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.02);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;position:relative;
  transition:transform .2s,box-shadow .2s;overflow:hidden;
}
.inv-cell.owned{
  border-color:var(--rc);
  background:linear-gradient(180deg,color-mix(in oklab,var(--rc) 18%,transparent),color-mix(in oklab,var(--rc) 6%,transparent));
  box-shadow:0 0 16px color-mix(in oklab,var(--rc) 25%,transparent);
}
.inv-cell.owned:hover{transform:translateY(-2px) scale(1.05)}
.inv-cell .e{font-size:22px;line-height:1}
.inv-cell .n{font-size:8px;font-weight:700;line-height:1;text-align:center;color:var(--rc,var(--muted));max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.inv-cell:not(.owned) .e{filter:grayscale(1);opacity:.25}
.inv-cell .cnt{position:absolute;top:-4px;right:-4px;background:#fff;color:#000;font-size:9px;font-weight:800;padding:1px 5px;border-radius:50px}
.inv-cell .pips{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.inv-cell .pip{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.15)}
.inv-cell .pip.gold{background:#fbbf24;box-shadow:0 0 4px #fbbf24}
.inv-cell .pip.rainbow{background:conic-gradient(from 0deg,#ec4899,#fbbf24,#10b981,#06b6d4,#8b5cf6,#ec4899);box-shadow:0 0 4px #a855f7}

/* upgrade tree */
.tree{
  display:flex;
  gap:12px;
  overflow-x:auto;
  overflow-y:hidden;
  padding-bottom:8px;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
}
.tree::-webkit-scrollbar{height:6px}
.tree::-webkit-scrollbar-thumb{
  background:rgba(139,92,246,.45);
  border-radius:999px;
}
.branch{
  min-width:260px;
  flex:0 0 260px;
  scroll-snap-align:start;
  border:1px solid var(--border);
  border-radius:18px;
  padding:10px;
  background:rgba(0,0,0,.25)
}
.branch-h{font-family:'Unbounded',sans-serif;font-size:10px;letter-spacing:1.8px;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--bc);margin-bottom:8px}
.up-node{
  width:100%;display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;border:1px solid var(--border);background:transparent;color:#fff;text-align:left;cursor:pointer;
  transition:transform .15s,box-shadow .2s,background .2s;margin-bottom:6px;position:relative;
}
.up-node + .up-node::before{
  content:'';position:absolute;top:-6px;left:22px;height:6px;width:1px;background:var(--bc);opacity:.4;
}
.up-node[data-lv="0"]{background:transparent}
.up-node:not([data-lv="0"]){background:linear-gradient(90deg,color-mix(in oklab,var(--bc) 14%,transparent),transparent)}
.up-node.maxed{border-color:var(--bc);box-shadow:0 0 14px color-mix(in oklab,var(--bc) 30%,transparent)}
.up-node:disabled{opacity:.45;cursor:not-allowed}
.up-node:not(:disabled):active{transform:scale(.98)}
.up-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:var(--bc);background:color-mix(in oklab,var(--bc) 18%,transparent);flex-shrink:0}
.up-body{flex:1;min-width:0}
.up-title{font-size:12px;font-weight:800;display:flex;justify-content:space-between;gap:4px}
.up-lv{font-family:'Unbounded',sans-serif;font-size:9px;color:var(--muted);letter-spacing:1px}
.up-desc{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3}
.up-cost{font-family:'Unbounded',sans-serif;font-size:9px;font-weight:800;letter-spacing:.5px;padding:4px 7px;border-radius:50px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;flex-shrink:0;white-space:nowrap}
.up-cost.maxed{background:var(--bc);color:#000}
.up-lock{font-size:9px;color:var(--c-mythic);margin-top:2px}

.foot{display:flex;justify-content:space-between;align-items:center;font-family:'Unbounded',sans-serif;font-size:9px;letter-spacing:1.5px;color:var(--muted);margin-top:6px}
.btn-reset{font:inherit;color:#fca5a5;background:transparent;border:1px solid rgba(252,165,165,.3);border-radius:50px;padding:5px 10px;cursor:pointer}

.coin-float{position:fixed;font-family:'Unbounded',sans-serif;font-weight:800;font-size:18px;color:#fde68a;pointer-events:none;z-index:100;text-shadow:0 0 12px rgba(253,230,138,.7);animation:coinFloat 1.2s ease-out forwards}
@keyframes coinFloat{
  0%{transform:translateY(0) scale(.6);opacity:0}
  20%{opacity:1;transform:translateY(-20px) scale(1.1)}
  100%{transform:translateY(-90px) scale(.9);opacity:0}
}

/* ============ BOTTOM NAV ============ */
.app{padding-bottom:90px}
.nav{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
  display:flex;gap:4px;padding:6px;border-radius:50px;
  border:1px solid var(--border);background:rgba(10,10,20,.75);backdrop-filter:blur(24px);
  z-index:50;box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.nav-btn{
  font-family:'Unbounded',sans-serif;font-size:10px;font-weight:800;letter-spacing:1.5px;
  padding:9px 14px;border-radius:50px;border:none;background:transparent;color:var(--muted);
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;
}
.nav-btn.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.5)}
.nav-btn .ic{font-size:14px}
.view{display:none;flex-direction:column;gap:14px}
.view.active{display:flex}

/* History */
.hist-list{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto}
.hist-row{
  display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;
  border:1px solid var(--border);background:rgba(0,0,0,.3);
}
.hist-row .hr-em{width:36px;height:48px;border-radius:8px;background:#1a1530;overflow:hidden;flex-shrink:0;display:grid;place-items:center;font-size:22px;border:2px solid var(--rc,var(--border));box-shadow:0 0 10px color-mix(in oklab,var(--rc,#888) 30%,transparent)}

function save(){

  try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){ console.error("save failed",e); }
  try{ if(typeof syncCloud==="function") syncCloud(); }catch(e){}

function mods(){
  const lv=id=>state.up[id]||0;
  const collSize=Object.keys(state.coll).length;
  const soulColl=lv("soul_5")*.02*Math.floor(collSize/5);
  const soulAll=lv("soul_3")*.10;
  const eternity=1+lv("soul_4")*1;
  return {
    luckAll:(lv("luck_1")*.05 + lv("luck_8")*.03 + soulColl + soulAll) * eternity,
    luckEpic:lv("luck_2")*.08*eternity,
    luckLeg:lv("luck_3")*.15*eternity,
    luckSec:lv("luck_4")*.25*eternity,
    luckMyth:lv("luck_6")*.10*eternity,
    luckExo:lv("luck_7")*.30*eternity,
    variantBoost:lv("luck_5")*.15*eternity,
    coinM:(1+lv("coin_1")*.1+lv("coin_4")*.15)*(1+lv("coin_5")*.5)*eternity,
    rarM:1+lv("coin_2")*.2,
    dupM:(1+lv("coin_3")*.5+lv("soul_1")*.08)*(1+lv("soul_2")*.3),
    variantCoin:1+lv("coin_6")*.4,
    cdM:0,
    spdM:Math.max(.15,(1-lv("speed_1")*.06-lv("speed_4")*.05)*(1-lv("speed_6")*.15)),
    rolls:1+lv("speed_2"),
    auto:lv("speed_3")>=1,
    autoSpd:1+lv("speed_5")*.20,
    skip:lv("asc_2")*.12,
    skipRare:lv("asc_5")*.08,
    specialBoost:(lv("asc_3")*.20)*eternity,
    asc:1+lv("asc_4")*1,
    cloverMult:2+lv("asc_6"),
    critChance:Math.min(.95,(lv("fort_1")*.04)*(1+lv("fort_6")*1)),
    critMult:2+lv("fort_2")*.5,
    doubleDrop:lv("fort_3")*.05,
    freeRoll:lv("fort_4")*.03,
    pity:lv("fort_5")*.10,
  };
}
function rollTeacher(){
  const m=mods();
  // pity: boost luck if last 5 trail were common
  const tr=state.history||[];
  let pityBoost=1;
  if(m.pity>0){
    const last=tr.slice(0,5).filter(h=>h.rarity==="common").length;
    if(last>=3) pityBoost=1+m.pity*last;
  }
  const w=TEACHERS.map(t=>{
    let x=t.chance;const tr=RARITY_TIER[t.rarity];
    if(tr>=1)x*=1+m.luckAll;
    if(tr>=2)x*=1+m.luckEpic;
    if(tr>=3)x*=1+m.luckMyth;
    if(tr>=4)x*=(1+m.luckLeg)*pityBoost;
    if(tr>=5)x*=1+m.luckExo;
    if(tr>=6)x*=1+m.luckSec;
    return x;
  });
  const pick=()=>{
    const tot=w.reduce((a,b)=>a+b,0);
    let r=Math.random()*tot;
    for(let i=0;i<TEACHERS.length;i++){r-=w[i];if(r<=0)return TEACHERS[i]}
    return TEACHERS[0];
  };
  let res=pick();
  if(res.rarity==="common"&&Math.random()<m.skip)res=pick();
  if(res.rarity==="rare"&&Math.random()<m.skipRare)res=pick();
  // variant
  let variant="normal";
  const vb=1+m.variantBoost;
  const r=Math.random();
  if(r<VARIANT_RAINBOW_CHANCE*vb) variant="rainbow";
  else if(r<(VARIANT_RAINBOW_CHANCE+VARIANT_GOLD_CHANCE)*vb) variant="gold";
  return {...res,variant};
}
function payout(t,isDup){
  const m=mods();
  let c=RARITY_COIN[t.rarity]*m.coinM*m.rarM*m.asc*VARIANT_MULT[t.variant];
  if(t.variant!=="normal") c*=m.variantCoin;
  if(isDup)c*=m.dupM;
  return Math.max(1,Math.floor(c));
}
function teacherDisplayName(t){
  if(t.variant==="normal") return t.name;
  return VARIANT_PREFIX[t.variant][t.g]+t.name;
}

function renderTree(){
  const el=$("tree");el.innerHTML="";
  Object.keys(BRANCH).forEach(b=>{
    const meta=BRANCH[b];
    const wrap=document.createElement("div");
    wrap.className="branch";
    wrap.style.setProperty("--bc",`var(${meta.c})`);
    wrap.innerHTML=`<div class="branch-h"><span>${meta.ic}</span>${meta.t}</div>`;
    UPGRADES.filter(u=>u.b===b).forEach(u=>{
      const lv=state.up[u.id]||0;
      const maxed=lv>=u.max;
      const cost=maxed?0:u.cost(lv);
      const reqOk=!u.req||u.req.every(r=>(state.up[r]||0)>=1);
      const can=!maxed&&reqOk&&state.coins>=cost;
      const btn=document.createElement("button");
      btn.className="up-node"+(maxed?" maxed":"");
      btn.dataset.lv=lv;btn.disabled=!can;
      btn.innerHTML=`
        <div class="up-icon">${u.ic}</div>
        <div class="up-body">
          <div class="up-title"><span>${u.t}</span><span class="up-lv">${lv}/${u.max}</span></div>
          <div class="up-desc">${u.d(Math.max(1,lv+(maxed?0:1)))}</div>
          ${!reqOk?`<div class="up-lock">🔒 нужен ${u.req[0]}</div>`:""}
        </div>
        <div class="up-cost ${maxed?"maxed":""}">${maxed?"MAX":cost.toLocaleString()+" 🪙"}</div>`;
      btn.onclick=()=>buyUp(u.id);

function buyUp(id){
  const u=UPGRADES.find(x=>x.id===id);if(!u)return;
  const lv=state.up[id]||0;if(lv>=u.max)return;
  const cost=u.cost(lv);if(state.coins<cost)return;
  if(u.req&&!u.req.every(r=>(state.up[r]||0)>=1))return;
  state.coins-=cost;state.up[id]=lv+1;save();renderAll();
}

const reelEl=$("reel"),wrapEl=$("reelWrap"),resultEl=$("result"),btnEl=$("btnOpen");
const ITEM_W=120;

function applyVariantClass(el,variant){
  el.classList.remove("is-gold","is-rainbow");
  if(variant==="gold") el.classList.add("is-gold");
  else if(variant==="rainbow") el.classList.add("is-rainbow");
}

function makeReelItem(o){
  const d=document.createElement("div");
  d.className="reel-item";
  if(o.kind==="clover"){d.classList.add("is-clover");d.innerHTML=`<div class="em">🍀</div>`;return d}
  if(o.kind==="bonus"){d.classList.add("is-bonus");d.innerHTML=`<div class="em">🎯</div>`;return d}
  // teacher
  d.style.setProperty("--rc",rarityColor(o.rarity));
  if(o.rarity==="glitch") d.classList.add("is-glitch");
  applyVariantClass(d,o.variant);
  let tag="";
  if(o.variant==="gold") tag=`<div class="tg tg-gold">GOLD</div>`;
  else if(o.variant==="rainbow") tag=`<div class="tg tg-rainbow">🌈</div>`;
  d.innerHTML=`${cardImgHTML(o,"em")}<div class="nm">${o.name.split(" ")[0]}</div>${tag}`;
  return d;
}

function buildReelItems(finalOutcome,allowSpecial){
  reelEl.innerHTML="";
  const len=60;
  const arr=[];
  for(let i=0;i<len-4;i++){
    const r=Math.random();
    if(allowSpecial && r<.05) arr.push({kind:"clover"});
    else if(allowSpecial && r<.10) arr.push({kind:"bonus"});
    else{
      const t=TEACHERS[Math.floor(Math.random()*TEACHERS.length)];
      const v=Math.random()<.05?"gold":(Math.random()<.02?"rainbow":"normal");
      arr.push({kind:"teacher",...t,variant:v});
    }
  }
  arr.push(finalOutcome);
  for(let i=0;i<3;i++){
    const t=TEACHERS[Math.floor(Math.random()*TEACHERS.length)];
    arr.push({kind:"teacher",...t,variant:"normal"});
  }
  arr.forEach(o=>reelEl.appendChild(makeReelItem(o)));
  return arr.length-4; // index of final
}

function spinReel(finalOutcome,allowSpecial,luckMult){
  return new Promise(resolve=>{
    const finalIdx=buildReelItems(finalOutcome,allowSpecial);
    reelEl.style.transition="none";
    reelEl.style.transform=`translate(0px,-50%)`;
    wrapEl.classList.add("spinning");
    wrapEl.classList.remove("locked");
    resultEl.classList.remove("show");

    const tier=finalOutcome.kind==="teacher"?RARITY_TIER[finalOutcome.rarity]:0;
    const distance=finalIdx*ITEM_W + (Math.random()*60-30);
    const finalDistance=finalIdx*ITEM_W;
    const dur=(1700 + tier*250 + (luckMult>1?400:0) + Math.random()*300) * (mods().spdM);

    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      reelEl.style.transition=`transform ${dur}ms var(--ease-reel)`;
      reelEl.style.transform=`translate(${-distance}px,-50%)`;
    }));

    setTimeout(()=>{
      reelEl.style.transition=`transform 250ms var(--ease-spring)`;
      reelEl.style.transform=`translate(${-finalDistance}px,-50%)`;
      setTimeout(()=>{
        wrapEl.classList.remove("spinning");
        if(finalOutcome.kind==="teacher"){
          wrapEl.style.setProperty("--rc",rarityColor(finalOutcome.rarity));
        }else{
          wrapEl.style.setProperty("--rc",finalOutcome.kind==="clover"?"#10b981":"#fde047");
        }
        wrapEl.classList.add("locked");
        resolve();
      },260);
    },dur);
  });
}

/* ============ PARTICLES ============ */
const cv=$("particles"),ctx=cv.getContext("2d");
function resizeCv(){cv.width=wrapEl.clientWidth;cv.height=wrapEl.clientHeight}
new ResizeObserver(resizeCv).observe(wrapEl);
let parts=[];
function burst(rarity,variant){
  resizeCv();
  const tier=RARITY_TIER[rarity];
  const n=20+tier*15+(variant!=="normal"?20:0);
  let cols=[rarityColor(rarity)];
  if(variant==="gold") cols=["#fbbf24","#fde68a","#d97706"];
  if(variant==="rainbow") cols=["#ec4899","#f97316","#fbbf24","#10b981","#06b6d4","#8b5cf6"];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=2+Math.random()*(4+tier);
    parts.push({
      x:cv.width/2,y:cv.height/2,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp - 2,
      life:1,decay:.012+Math.random()*.012,
      size:2+Math.random()*3,col:cols[Math.floor(Math.random()*cols.length)],
    });
  }
  if(!parts._raf){parts._raf=true;requestAnimationFrame(stepParts)}
}
function stepParts(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.vy+=.12;p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  if(parts.length){requestAnimationFrame(stepParts)}else{parts._raf=false}
}

/* ============ COIN FLOAT ============ */
function coinFloat(amount){
  const el=document.createElement("div");
  el.className="coin-float";el.textContent="+"+amount.toLocaleString()+" 🪙";
  const r=$("coins").getBoundingClientRect();
  el.style.left=(r.left+r.width/2-30)+"px";
  el.style.top=(r.bottom+8)+"px";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1300);
}

/* ============ TRAIL ============ */
function pushTrail(o){
  const t=$("trail");
  const p=document.createElement("div");
  p.className="trail-pill";
  if(o.kind==="clover"){p.classList.add("t-clover");p.textContent="🍀"}
  else if(o.kind==="bonus"){p.classList.add("t-bonus");p.textContent="🎯"}
  else{
    if(o.variant==="gold") p.classList.add("t-gold");
    if(o.variant==="rainbow") p.classList.add("t-rainbow");
    p.textContent=o.emoji;
  }
  t.appendChild(p);
  while(t.children.length>10) t.removeChild(t.firstChild);
}
function clearTrail(){$("trail").innerHTML=""}

function setLuck(text,big){
  const el=$("luckStrip");
  el.innerHTML=text;
  if(big) el.classList.add("big"); else el.classList.remove("big");
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function openBox(){
  if(!currentUser){ openAuth(); toast("Сначала создай аккаунт или войди"); return; }
  const m=mods();
  if(rolling)return;
  state.last=Date.now();rolling=true;setBtn();

  clearTrail();

  // chain spins for clover/bonus
  let luckMult=1;
  let cloverCount=0;
  let bonusStreak=0;
  let allowSpecial=true;
  // base special chances boosted by asc_3
  const sb=1+m.specialBoost;
  const CL=0.06*sb;
  const BN=0.055*sb;

  setLuck(`Открываем…`);

  let final=null;
  // limit safety
  for(let safety=0;safety<8;safety++){
    let outcome;
    if(allowSpecial){
      const r=Math.random();
      if(r<CL) outcome={kind:"clover"};
      else if(r<CL+BN) outcome={kind:"bonus"};
      else outcome={kind:"teacher",...rollTeacher()};
    }else{
      outcome={kind:"teacher",...rollTeacher()};
    }
    await spinReel(outcome,allowSpecial,luckMult);
    pushTrail(outcome);

    if(outcome.kind==="clover"){
      cloverCount++;
      luckMult*=m.cloverMult;
      setLuck(`🍀 КЛЕВЕР! Удача <span class="lk-mult">×${luckMult}</span>`);
      if(navigator.vibrate)navigator.vibrate(15);
      if(cloverCount>=2) allowSpecial=false;
      await wait(700);
      continue;
    }
    if(outcome.kind==="bonus"){
      bonusStreak++;
      if(bonusStreak>=3){
        luckMult=Math.max(luckMult,100);
        bonusStreak=0;
        allowSpecial=false;
        setLuck(`🎯 ДЖЕКПОТ! <span class="lk-mult big">×${luckMult}</span>`,true);
        if(navigator.vibrate)navigator.vibrate([20,40,80]);
      }else{
        setLuck(`🎯 Бонус ${bonusStreak}/3`);
        if(navigator.vibrate)navigator.vibrate(10);
      }
      await wait(750);
      continue;
    }
    final=outcome;
    break;
  }

  // record collection (only the final teacher) — luck multiplier scales coins
  const t=final;
  const slot=t.variant==="gold"?"g":(t.variant==="rainbow"?"r":"n");
  const cur=state.coll[t.id]||{n:0,g:0,r:0};
  const isNewVariant=cur[slot]===0;
  cur[slot]++;state.coll[t.id]=cur;
  const isDupAny=(cur.n+cur.g+cur.r)>1;
  let baseCoins=payout(t,isDupAny);
  // crit
  const isCrit=Math.random()<m.critChance;
  if(isCrit) baseCoins=Math.floor(baseCoins*m.critMult);
  // double drop bonus payout
  const isDouble=Math.random()<m.doubleDrop;
  if(isDouble) baseCoins*=2;
  const totalCoins=Math.floor(baseCoins*luckMult);
  state.coins+=totalCoins;state.opens++;
  // history
  state.history.unshift({id:t.id,name:t.name,rarity:t.rarity,variant:t.variant,emoji:t.emoji,coins:totalCoins,ts:Date.now()});
  if(state.history.length>100) state.history.length=100;
  save();

  // reveal
  resultEl.classList.remove("is-gold","is-rainbow");
  if(t.variant==="gold") resultEl.classList.add("is-gold");
  if(t.variant==="rainbow") resultEl.classList.add("is-rainbow");
  wrapEl.style.setProperty("--rc",rarityColor(t.rarity));
  resultEl.style.setProperty("--rc",t.variant==="gold"?"#fbbf24":(t.variant==="rainbow"?"#a855f7":rarityColor(t.rarity)));
  $("rEm").outerHTML=`<div class="em-wrap" id="rEm">${cardImgHTML(t,"em")}</div>`;
  $("rRar").textContent=RARITY_LABEL[t.rarity];
  $("rNm").textContent=teacherDisplayName(t);
  let rwTxt=`+${totalCoins.toLocaleString()} 🪙`;
  const flags=[];
  if(luckMult>1) flags.push(`×${luckMult}`);
  if(isCrit) flags.push(`💥КРИТ`);
  if(isDouble) flags.push(`♊×2`);
  if(flags.length) rwTxt+=`  (${flags.join(' ')})`;
  $("rRw").textContent=rwTxt;
  $("rNew").style.display=isNewVariant?"block":"none";
  const vt=$("rVtag");
  if(t.variant==="gold"){vt.style.display="block";vt.className="vtag tg-gold";vt.textContent="GOLD"}
  else if(t.variant==="rainbow"){vt.style.display="block";vt.className="vtag tg-rainbow";vt.textContent="🌈 RAINBOW"}
  else{vt.style.display="none"}
  resultEl.classList.add("show");

  burst(t.rarity,t.variant);
  coinFloat(totalCoins);
  const tier=RARITY_TIER[t.rarity];
  if(tier>=3||t.variant!=="normal"){document.getElementById("app").classList.add("shake-screen");setTimeout(()=>document.getElementById("app").classList.remove("shake-screen"),500)}
  if(navigator.vibrate)navigator.vibrate(tier>=3?[30,40,80]:tier>=1?20:10);

  setLuck(luckMult>1?`🏆 Победа! Удача <span class="lk-mult ${luckMult>=100?"big":""}">×${luckMult}</span>`:"🏆 Готово!",luckMult>=100);

  rolling=false;renderAll();setBtn();

  // EPIC ANIMATION for exotic and above (tier>=5)
  if(tier>=5){
    rolling=true;setBtn();
    await playEpic(t,totalCoins);
    rolling=false;setBtn();
  }

  setTimeout(()=>{
    if(!rolling){
      resultEl.classList.remove("show");
      wrapEl.classList.remove("locked");
      setLuck("Готов крутить");
    }
  },tier>=4||t.variant==="rainbow"?3200:2000);
}

/* ============ EPIC OVERLAY ============ */
function playEpic(t,coins){
  return new Promise(resolve=>{
    const ov=$("epicOv");
    const col=rarityColor(t.rarity);
    ov.style.setProperty("--ec",col);
    $("epRar").textContent=RARITY_LABEL[t.rarity].toUpperCase();
    $("epNm").textContent=teacherDisplayName(t);
    $("epCoin").textContent=`+${coins.toLocaleString()} 🪙`;
    const subMap={exotic:"ЭКЗОТИЧЕСКОЕ ОТКРЫТИЕ",secret:"СЕКРЕТНОЕ СОБЫТИЕ",glitch:"⚠️ ГЛИТЧ В МАТРИЦЕ ⚠️"};
    $("epSub").textContent=subMap[t.rarity]||"РЕДЧАЙШАЯ НАХОДКА";
    // image
    const paths=cardImgPaths(t);
    const img=$("epImg");
    img._i=0;
    img.src=paths[0];
    img.onerror=function(){this._i++;if(this._i<paths.length)this.src=paths[this._i];else this.style.display='none'};
    img.style.display='block';
    // restart css animations
    ov.classList.remove("show");void ov.offsetWidth;
    // stars
    const sw=$("epStars");sw.innerHTML="";
    const cx=window.innerWidth/2,cy=window.innerHeight/2;
    const N=t.rarity==="glitch"?80:t.rarity==="secret"?60:45;
    for(let i=0;i<N;i++){
      const s=document.createElement("div");
      s.className="ep-star";
      const a=Math.random()*Math.PI*2;
      const d=200+Math.random()*500;
      s.style.left=cx+"px";s.style.top=cy+"px";
      s.style.setProperty("--tx",Math.cos(a)*d+"px");
      s.style.setProperty("--ty",Math.sin(a)*d+"px");
      s.style.animationDuration=(2+Math.random()*3)+"s";
      s.style.animationDelay=(Math.random()*4)+"s";
      const cols=t.variant==="rainbow"?["#ec4899","#fbbf24","#10b981","#06b6d4","#8b5cf6"]:[col,"#fff","#fde68a"];
      s.style.background=cols[i%cols.length];
      s.style.boxShadow=`0 0 12px ${cols[i%cols.length]}`;
      sw.appendChild(s);
    }
    ov.classList.add("show");
    if(navigator.vibrate)navigator.vibrate([40,60,40,60,120]);

    let done=false;
    const finish=()=>{
      if(done)return;done=true;
      ov.classList.remove("show");
      resolve();
    };
    const dur=t.rarity==="glitch"?15000:t.rarity==="secret"?13000:11000;
    const to=setTimeout(finish,dur);
    $("epSkip").onclick=()=>{clearTimeout(to);finish()};
  });
}

async function hashPw(pw){
  const enc=new TextEncoder().encode(pw+"::teacherboxes_preview");
  const buf=await crypto.subtle.digest("SHA-256",enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function doAuth(){
  if(!sb){ toast("Supabase не настроен"); return; }
  const nick=document.getElementById("authNick").value.trim();
  const pass=document.getElementById("authPass").value;
  if(nick.length<3){ toast("Никнейм минимум 3 символа"); return; }
  if(pass.length<4){ toast("Пароль минимум 4 символа"); return; }
  const hash=await hashPw(pass);
  if(authMode==="signup"){
    const { data: ex } = await sb.from(TABLE).select("nickname").eq("nickname",nick).maybeSingle();
    if(ex){ toast("❌ Никнейм занят"); return; }
    const { error } = await sb.from(TABLE).insert({
      nickname:nick, password_hash:hash,
      coins: state.coins||0, opens: state.opens||0,
      state: state
    });
    if(error){ toast("Ошибка: "+error.message); return; }
    currentUser={nickname:nick,password_hash:hash};
    localStorage.setItem("tb_preview_user",JSON.stringify(currentUser));
    toast("✅ Аккаунт создан");
    updateUserChip(); closeAuth();
  } else {
    const { data, error } = await sb.from(TABLE).select("*").eq("nickname",nick).maybeSingle();
    if(error||!data){ toast("❌ Не найдено"); return; }
    if(data.password_hash!==hash){ toast("❌ Неверный пароль"); return; }
    currentUser={nickname:nick,password_hash:hash};
    localStorage.setItem("tb_preview_user",JSON.stringify(currentUser));
    if(data.state){
      state = {...state, ...data.state};
      if(!Array.isArray(state.history)) state.history=[];
      if(!state.coll) state.coll={};
      if(!state.up) state.up={};
    }
    save(); renderAll();
    toast("✅ С возвращением, "+nick);
    updateUserChip(); closeAuth();
  }
}

async function restoreSession(){
  const raw = localStorage.getItem("tb_preview_user");
  if(!raw||!sb)return;
  try{
    const u = JSON.parse(raw);
    const { data } = await sb.from(TABLE).select("*").eq("nickname",u.nickname).maybeSingle();
    if(data && data.password_hash===u.password_hash){
      currentUser=u;
      if(data.state){
        state = {...state, ...data.state};
        if(!Array.isArray(state.history)) state.history=[];
        if(!state.coll) state.coll={};
        if(!state.up) state.up={};
      }
      try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
      renderAll(); updateUserChip();
    }
  }catch(e){}
}

async function bootAuth(){
  await restoreSession();

}

async function loadLeaderboard(){

  const { data, error } = await sb.from(TABLE).select("nickname,coins,opens").order(lbSort,{ascending:false}).limit(100);
  if(error){ el.innerHTML='<div style="text-align:center;color:#ef4444;padding:20px;font-size:13px">Ошибка: '+error.message+'</div>'; return; }

    const row=document.createElement("div");

    const rkCls = rank===1?"g1":rank===2?"g2":rank===3?"g3":"";
    const val = lbSort==="coins" ? (u.coins||0).toLocaleString()+" 🪙" : (u.opens||0).toLocaleString()+" 📦";

    el.appendChild(row);
  });
}
